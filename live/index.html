<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>即時翻譯字幕列</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="home">
    <main id="bar" aria-label="即時翻譯字幕工具列">
      <div class="heading"><span>即時翻譯</span><span id="metrics"></span></div>
      <p id="caption" aria-live="polite" aria-atomic="true">翻譯字幕會顯示在這裡</p>
      <p id="original" lang="en"></p>
      <div class="controls">
        <label>音訊來源<select id="audio-source"><option value="tab">Chrome 分頁</option><option value="system">系統音訊</option></select></label>
        <label>來源語系<select id="source"><option value="en">英文</option><option value="zh">繁體中文</option><option value="ja">日文</option></select></label>
        <span class="arrow" aria-hidden="true">→</span>
        <label>字幕語系<select id="target"><option value="zh">繁體中文</option><option value="en">英文</option><option value="ja">日文</option></select></label>
        <button id="start" type="button">開始翻譯</button>
        <button id="stop" type="button" disabled>停止</button>
        <button id="float" type="button">懸浮置頂</button>
      </div>
      <div class="foot">
        <label class="mute"><input id="mute" type="checkbox" checked>分頁靜音擷取</label>
        <span id="status" role="status" aria-live="polite">尚未開始</span>
      </div>
      <p id="hint">在 Windows Chrome 開啟 localhost，選擇來源並勾選「分享音訊」。準備完成後再播放內容。</p>
    </main>
  </div>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
